name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: 测试（Node 22）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: 主测试套件（run-tests）
        run: node test/run-tests.js

      - name: 无头冒烟（smoke）
        run: node test/smoke.js
