<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="384" viewBox="0 0 1200 384"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">MicroWorld — offline single-player desk-side observation game</title>
  <desc id="hero-desc">Dark title board: project name and one-line value with feature tags on the left; a live status readout and the infection-dots-and-routes motif on the right.</desc>

  <defs>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd8b0"/>
      <stop offset="0.55" stop-color="#1d6a72"/>
      <stop offset="1" stop-color="#0d2a33"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="384" rx="26" fill="#0a1216"/>
  <g stroke="#78c8dc" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="96" x2="1200" y2="96"/>
    <line x1="0" y1="192" x2="1200" y2="192"/>
    <line x1="0" y1="288" x2="1200" y2="288"/>
    <line x1="640" y1="0" x2="640" y2="384"/>
  </g>

  <g id="title-block" transform="translate(64 52)">
    <text x="0" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18"
          fill="#7fa8ad" letter-spacing="4">OFFLINE · SINGLE-PLAYER · DESK-SIDE</text>
    <text x="-2" y="102" font-family="'Segoe UI',system-ui,sans-serif" font-size="76"
          font-weight="300" fill="#eafff8" letter-spacing="4">MICROWORLD</text>
    <text x="6" y="130" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="20"
          fill="#7fa8ad" letter-spacing="10">微 疫 世 界</text>
    <rect x="2" y="146" width="188" height="3" rx="1.5" fill="#4fd8b0" fill-opacity="0.75"/>
    <text x="0" y="188" font-family="'Segoe UI',system-ui,sans-serif" font-size="23"
          fill="#cfe8ea">A tiny world that runs by itself on your desk.</text>
    <text x="0" y="222" font-family="'Segoe UI',system-ui,sans-serif" font-size="23"
          fill="#cfe8ea">One glance tells you everything.</text>
    <g id="feature-chips" font-family="'Segoe UI',system-ui,sans-serif" font-size="18" fill="#9fc9de">
      <rect x="0" y="248" rx="15" width="186" height="34" fill="none" stroke="#78c8dc" stroke-opacity="0.3"/>
      <text x="24" y="271">Zero-grind automation</text>
      <rect x="200" y="248" rx="15" width="170" height="34" fill="none" stroke="#78c8dc" stroke-opacity="0.3"/>
      <text x="224" y="271">45–120 min rounds</text>
      <rect x="384" y="248" rx="15" width="104" height="34" fill="none" stroke="#78c8dc" stroke-opacity="0.3"/>
      <text x="408" y="271">CPU only</text>
      <rect x="0" y="292" rx="15" width="126" height="34" fill="none" stroke="#78c8dc" stroke-opacity="0.3"/>
      <text x="24" y="315">Fully offline</text>
      <rect x="140" y="292" rx="15" width="120" height="34" fill="none" stroke="#78c8dc" stroke-opacity="0.3"/>
      <text x="164" y="315">60 FPS map</text>
    </g>
  </g>

  <g id="status-board" transform="translate(700 60)">
    <rect width="436" height="252" rx="18" fill="#0c181e" stroke="#78c8dc" stroke-opacity="0.16"/>
    <g font-family="'Segoe UI',system-ui,sans-serif">
      <rect x="24" y="22" rx="13" width="104" height="30" fill="rgba(79,216,176,0.12)" stroke="rgba(79,216,176,0.35)"/>
      <text x="40" y="43" font-size="17" fill="#9fe8cf">Spreading</text>
      <text x="148" y="43" font-size="17" fill="#7fa8ad">Day</text>
      <text x="196" y="43" font-size="17" fill="#cfe8ea">Y2 · D339</text>

      <text x="24" y="88" font-size="18" fill="#7fa8ad">Infected</text>
      <text x="106" y="89" font-size="24" font-weight="600" fill="#eafff8">5.64M</text>
      <path d="M186 80 l6 -10 6 10 z" fill="#ff6b6b"/>
      <text x="216" y="88" font-size="18" fill="#7fa8ad">Deaths</text>
      <text x="286" y="89" font-size="24" font-weight="600" fill="#cfe8ea">210M</text>
      <text x="24" y="130" font-size="18" fill="#7fa8ad">Research</text>
      <text x="116" y="131" font-size="24" font-weight="600" fill="#cfe8ea">41%</text>
      <rect x="196" y="120" width="170" height="7" rx="3.5" fill="rgba(120,200,220,0.14)"/>
      <rect x="196" y="120" width="70" height="7" rx="3.5" fill="#4fd8b0"/>

      <g stroke="#cfe8ea" stroke-opacity="0.16" stroke-width="1">
        <line x1="70" y1="200" x2="150" y2="176"/>
        <line x1="150" y1="176" x2="232" y2="204"/>
        <line x1="232" y1="204" x2="330" y2="182"/>
        <line x1="150" y1="176" x2="196" y2="150"/>
        <line x1="196" y1="150" x2="330" y2="182"/>
        <line x1="70" y1="200" x2="196" y2="150"/>
      </g>
      <circle cx="70" cy="200" r="9" fill="#3a6a78"/>
      <circle cx="150" cy="176" r="14" fill="#3a6a78"/>
      <circle cx="232" cy="204" r="11" fill="#4fd8b0" fill-opacity="0.85"/>
      <circle cx="330" cy="182" r="16" fill="#b48cff" fill-opacity="0.9"/>
      <circle cx="196" cy="150" r="7" fill="#3a6a78"/>
      <circle cx="290" cy="150" r="6" fill="#3a6a78"/>
      <circle cx="330" cy="182" r="24" fill="none" stroke="#b48cff" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="330" cy="182" r="34" fill="none" stroke="#b48cff" stroke-opacity="0.15" stroke-width="1"/>

      <text x="24" y="236" font-size="17" fill="#7fa8ad">Live aggregate sim · 1–2 Hz · 80 regions · land / sea / air</text>
    </g>
  </g>

  <text x="1160" y="364" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="16" fill="#7fa8ad" fill-opacity="0.7">MW · desk-side observation pod</text>
</svg>
